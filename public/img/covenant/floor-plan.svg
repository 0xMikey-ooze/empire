<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Scripture-bounded construction schematic of the Ark of the Covenant</title>
  <desc id="desc">An exploded schematic showing the shittim-wood chest, gold overlay, mercy seat, two cherubim, four rings, and carrying staves described in Exodus 25.</desc>
  <rect width="1000" height="600" fill="#f3ead9"/>
  <text x="500" y="42" text-anchor="middle" fill="#322d29" font-family="Georgia,serif" font-size="28" font-weight="700">Ark of the Covenant — construction schematic</text>
  <text x="500" y="69" text-anchor="middle" fill="#6f655d" font-family="Arial,sans-serif" font-size="14">Named parts and dimensions from Exodus 25:10–22 · decorative form is illustrative</text>

  <!-- Mercy seat and cherubim are separated from the chest only to show their relationship. -->
  <rect x="290" y="145" width="420" height="54" rx="4" fill="#c9a750" stroke="#6f5722" stroke-width="5"/>
  <text x="500" y="178" text-anchor="middle" fill="#3c321f" font-family="Arial,sans-serif" font-size="16" font-weight="700">MERCY SEAT · PURE GOLD · 2½ × 1½ CUBITS</text>
  <path d="M350 141c-62-50-52-105 6-73 28 16 46 41 64 73" fill="#d7b85e" stroke="#6f5722" stroke-width="5"/>
  <path d="M650 141c62-50 52-105-6-73-28 16-46 41-64 73" fill="#d7b85e" stroke="#6f5722" stroke-width="5"/>
  <text x="500" y="112" text-anchor="middle" fill="#6f5722" font-family="Arial,sans-serif" font-size="14" font-weight="700">TWO CHERUBIM OF BEATEN GOLD · FACING THE MERCY SEAT</text>

  <!-- The rectangular envelope preserves the dimensions Scripture supplies. -->
  <rect x="265" y="270" width="470" height="190" rx="5" fill="#9a7652" stroke="#4d3c2d" stroke-width="8"/>
  <rect x="285" y="290" width="430" height="150" rx="3" fill="#c8a44f" stroke="#6f5722" stroke-width="4"/>
  <rect x="330" y="328" width="340" height="74" fill="#b2875e" stroke="#4d3c2d" stroke-width="4"/>
  <text x="500" y="360" text-anchor="middle" fill="#fff9e8" font-family="Arial,sans-serif" font-size="17" font-weight="700">SHITTIM-WOOD CHEST</text>
  <text x="500" y="385" text-anchor="middle" fill="#fff9e8" font-family="Arial,sans-serif" font-size="14">overlaid with pure gold within and without</text>
  <path d="M270 280h460M270 450h460" stroke="#d9b85a" stroke-width="10"/>
  <text x="500" y="484" text-anchor="middle" fill="#6f5722" font-family="Arial,sans-serif" font-size="13" font-weight="700">CROWN OF GOLD ROUND ABOUT</text>

  <!-- Four visible rings and two staves show the carrying system without suggesting removal. -->
  <g fill="#d0aa4e" stroke="#5c481e" stroke-width="5">
    <circle cx="280" cy="335" r="16"/><circle cx="280" cy="410" r="16"/>
    <circle cx="720" cy="335" r="16"/><circle cx="720" cy="410" r="16"/>
  </g>
  <path d="M90 335h820M90 410h820" stroke="#8b643e" stroke-width="18" stroke-linecap="round"/>
  <path d="M90 335h820M90 410h820" stroke="#cda54d" stroke-width="8" stroke-linecap="round"/>
  <text x="500" y="530" text-anchor="middle" fill="#5f5248" font-family="Arial,sans-serif" font-size="14">FOUR GOLD RINGS · SHITTIM-WOOD STAVES OVERLAID WITH GOLD · NOT TO BE TAKEN FROM THE RINGS</text>
  <text x="500" y="560" text-anchor="middle" fill="#6f655d" font-family="Arial,sans-serif" font-size="13">Chest: 2½ cubits long × 1½ broad × 1½ high</text>
  <text x="500" y="584" text-anchor="middle" fill="#6f655d" font-family="Arial,sans-serif" font-size="12">Educational exploded view · Scripture does not describe a hinged opening or an archaeological artifact</text>
</svg>
