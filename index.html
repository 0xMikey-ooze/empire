<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bible Discovery — explore biblical structures, sacred objects, and visions through interactive 3D exhibits." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link preview card.
         NOTE: og:image and og:url must be ABSOLUTE urls. Most crawlers resolve
         a relative path against the page, but not all — swap in the real
         origin once the
         site has a domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bible Discovery" />
    <meta property="og:title" content="Bible Discovery" />
    <meta
      property="og:description"
      content="Explore Noah's Ark, the Ark of the Covenant, the Tabernacle, Solomon's Temple, and Daniel's great image in interactive 3D."
    />
    <meta property="og:image" content="/img/noah/hero.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:alt" content="A Scripture-grounded reconstruction of Noah's Ark in Bible Discovery." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bible Discovery" />
    <meta
      name="twitter:description"
      content="Explore biblical structures, sacred objects, and visions through interactive 3D exhibits grounded in Scripture."
    />
    <meta name="twitter:image" content="/img/noah/hero.webp" />
    <meta name="twitter:image:alt" content="A Scripture-grounded reconstruction of Noah's Ark in Bible Discovery." />

    <meta name="theme-color" content="#f8f3ec" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

  </body>
